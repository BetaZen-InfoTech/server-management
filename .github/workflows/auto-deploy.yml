name: Auto Deploy

# This is the active auto-deploy workflow. The original "deploy.yml" was
# manually disabled in GitHub, so pushes to main stopped reaching the VPS.
# A disabled workflow can only be re-enabled from the GitHub UI, but a new
# workflow file is enabled by default — so this file takes over.
#
# If you ever need to pause deploys, disable THIS workflow in the Actions
# UI (click the workflow → ⋯ → Disable workflow).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            export PATH=$PATH:/usr/local/go/bin:/opt/go/1.23/bin
            cd /opt/serverpanel

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building backend ==="
            cd /opt/serverpanel/backend
            go mod tidy
            CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /opt/serverpanel/bin/server   ./cmd/server
            CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /opt/serverpanel/bin/agent    ./cmd/agent
            CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /opt/serverpanel/bin/seed     ./cmd/seed
            CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /opt/serverpanel/bin/bzpanel  ./cmd/bzpanel
            ln -sf /opt/serverpanel/bin/bzpanel /usr/local/bin/bzpanel

            echo "=== Building frontend ==="
            cd /opt/serverpanel/frontend
            npm install --legacy-peer-deps
            npx turbo run build

            echo "=== Restarting services ==="
            systemctl restart serverpanel
            systemctl restart serverpanel-agent 2>/dev/null || true

            echo "=== Health check ==="
            sleep 3
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "health: OK"
            elif curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "health: backend responding on :8080"
            else
              echo "WARNING: health check failed — dumping journal"
              journalctl -u serverpanel -n 30 --no-pager || true
              exit 1
            fi

            echo "=== Deploy complete ==="
