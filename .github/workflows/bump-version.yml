name: Bump Patch Version

# Runs on every push to main and bumps backend/pkg/version/version.go's
# Patch constant by 1. The bumped commit is pushed back as the bot
# user; no `[skip ci]` tag — we WANT the deploy workflow to fire on
# the bumped commit so the VPS ends up running the incremented number.
#
# The workflow is a no-op when:
#   - the pushed commit was itself this bot's bump (commit message
#     starts with `chore(version): bump to`) — otherwise we'd recurse
#     forever incrementing on our own commits
#   - the change touches only non-code files (docs / .github / *.md)
#     where a version bump doesn't carry useful meaning
#
# Pair with the deploy workflow: this bump commit triggers its own
# deploy, so the operator always sees the new number in the panel
# within a single human-push cycle.

on:
  push:
    branches: [main]

concurrency:
  # Serialise bumps so two back-to-back pushes don't race on the same
  # Patch number. One gets the increment, the other retries on the
  # up-to-date HEAD.
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version.Patch
    runs-on: ubuntu-latest
    # Skip when this push WAS the bump commit (circular protection).
    if: "!contains(github.event.head_commit.message, 'chore(version): bump to')"

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT when the repo's default protection rules block
          # the ephemeral GITHUB_TOKEN from pushing. Set BUMP_PAT in
          # repo Settings → Secrets if this workflow ever reports
          # "permission denied" on push.
          token: ${{ secrets.BUMP_PAT || secrets.GITHUB_TOKEN }}

      - name: Skip if the change is docs-only
        id: scope
        run: |
          # If the latest push changed only docs / CI files, there's
          # nothing a version bump would communicate — skip to save a
          # round-trip.
          changed=$(git diff --name-only HEAD~1 HEAD || echo "")
          echo "changed files:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qvE '^(\.github/|docs/|.*\.md$|LICENSE$)'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Patch
        if: steps.scope.outputs.skip != 'true'
        id: bump
        run: |
          file=backend/pkg/version/version.go
          # Extract current Major / Minor / Patch.
          major=$(grep -oE 'Major = [0-9]+' "$file" | awk '{print $3}')
          minor=$(grep -oE 'Minor = [0-9]+' "$file" | awk '{print $3}')
          patch=$(grep -oE 'Patch = [0-9]+' "$file" | awk '{print $3}')
          new_patch=$((patch + 1))
          echo "current: $major.$minor.$patch  →  new: $major.$minor.$new_patch"

          # Single in-place edit — sed matches only the `Patch = <n>`
          # line so Major/Minor remain untouched.
          sed -i -E "s/^(\tPatch = )[0-9]+/\1${new_patch}/" "$file"

          # Sanity-check the edit actually took — abort loudly if the
          # regex missed (would have silently left Patch unchanged and
          # pushed an empty commit).
          grep -qE "^\tPatch = ${new_patch}\$" "$file" || {
            echo "ERROR: sed didn't update Patch — abort"
            cat "$file"
            exit 1
          }

          echo "version=${major}.${minor}.${new_patch}" >> "$GITHUB_OUTPUT"

      - name: Commit + push
        if: steps.scope.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "betazen-version-bot"
          git config user.email "version-bot@betazeninfotech.com"
          git add backend/pkg/version/version.go
          # No [skip ci] — we WANT the deploy workflow to fire on this
          # bumped commit so the VPS binary actually renders the new
          # version number. The top-level `if:` above prevents this
          # bump job from recursing on its own push (it filters on the
          # "chore(version): bump to" prefix).
          git commit -m "chore(version): bump to ${NEW_VERSION}"
          git push
